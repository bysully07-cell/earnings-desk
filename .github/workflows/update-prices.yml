name: Update prices (every 30 min, market hours)

on:
  schedule:
    # Every 30 minutes, 13:07-21:37 UTC Mon-Fri. That window covers 9:30am-4:30pm ET
    # in both EST (14:30-21:00 UTC) and EDT (13:30-20:00 UTC); update_prices.py checks the
    # real New York time and skips runs outside market hours and on holidays.
    # Minutes 7 and 37 avoid :00/:30, when GitHub's scheduler is busiest and drops runs.
    - cron: "7,37 13-21 * * 1-5"
  # Backup trigger: an external cron (cron-job.org) calls the workflow_dispatch API every
  # 30 minutes with min_gap=10, because GitHub's scheduler can delay or skip runs.
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside market hours"
        type: boolean
        default: false
      min_gap:
        description: "Skip if prices were saved less than this many minutes ago (0 = never skip)"
        type: string
        default: "0"

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.prices.outputs.changed }}
      too_many_failed: ${{ steps.prices.outputs.too_many_failed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch quotes from Finnhub
        id: prices
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        # Scheduled runs and the external cron skip if another trigger saved prices in the last
        # 10 minutes, so a run doubled by both triggers is harmless.
        run: >-
          python update_prices.py
          ${{ inputs.force && '--force' || '' }}
          --min-gap ${{ github.event_name == 'schedule' && '10' || inputs.min_gap || '0' }}

      - name: Commit data/index.json
        if: steps.prices.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  # Runs after the deploy, so the prices that did come through are already live.
  # Turns the run red only when more than 20% of tickers were skipped.
  check:
    needs: [update, deploy]
    if: ${{ !cancelled() && needs.update.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail if too many tickers were skipped
        if: needs.update.outputs.too_many_failed == 'true'
        run: |
          echo "::error::More than 20% of tickers failed to fetch; see the 'Fetch quotes from Finnhub' log."
          exit 1
