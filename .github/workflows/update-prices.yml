name: Update prices (every 30 min, market hours)

on:
  schedule:
    # Every 30 minutes, 13:00-21:30 UTC Mon-Fri. That window covers 9:30am-4:30pm ET
    # in both EST and EDT; update_prices.py skips runs outside market hours and on holidays.
    - cron: "*/30 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside market hours"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.prices.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch quotes from Finnhub
        id: prices
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python update_prices.py ${{ inputs.force && '--force' || '' }}

      - name: Commit data/index.json
        if: steps.prices.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
