name: Update fundamentals (daily)

# SEC bulk data + Finnhub EPS surprises, logos, share counts and analyst ratings,
# plus price targets from the first source that works (Finnhub, FMP, Alpha Vantage).
on:
  schedule:
    # 11:17 UTC Mon-Fri = 6:17am ET in winter, 7:17am ET in summer (off the busy :00/:30 slots).
    - cron: "17 11 * * 1-5"
  # Backup trigger: an external cron (cron-job.org) calls the workflow_dispatch API each
  # weekday morning with skip_if_ran_today=true, in case GitHub's scheduler skips the run.
  workflow_dispatch:
    inputs:
      skip_if_ran_today:
        description: "Skip if the data was already rebuilt today (New York date)"
        type: boolean
        default: false

permissions:
  contents: write

# Shared with the price job: only one data job at a time, so the two never
# call Finnhub simultaneously (keeps us under 60 requests/minute) or race on git push.
concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build data files from SEC bulk archives + Finnhub + price-target source
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then unset SEC_USER_AGENT; fi
          python fetch_data.py ${{ (github.event_name == 'schedule' || inputs.skip_if_ran_today) && '--skip-if-ran-today' || '' }}

      - name: Commit data/ if it changed
        run: |
          git add data
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update fundamentals $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
